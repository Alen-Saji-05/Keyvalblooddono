# Alembic configuration.
#
# This file lives inside the migrations directory because that is where Flask-Migrate
# looks for it. Placed at the backend root instead, Alembic finds no config file, and
# the logging setup in env.py then fails on an empty parser with a KeyError that does
# not name the actual problem.
#
# script_location is deliberately absent: Flask-Migrate sets it from the directory it
# was given, so hardcoding it here would be a second source of truth for the same path.
#
# The database URL is deliberately absent too. env.py takes it from the Flask
# application config, so migrations cannot run against a different database than the
# application uses.

[alembic]
prepend_sys_path = .
# Stated explicitly; without it Alembic warns and falls back to splitting the path on
# spaces, commas, and colons, which breaks on any Windows drive letter.
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
