[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The test database is dropped and rebuilt from the migration on every run, so a
# revision that has drifted from the models fails the whole suite rather than being
# discovered in production.
addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    error::DeprecationWarning:app.*
